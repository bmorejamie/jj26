<script>
  /* Review aids: ?slow=4 plays the dance four times slower. */
  (function () {
    var mw = window.JJMoonwalker; if (!mw) return;
    var slow = parseFloat(new URLSearchParams(location.search).get("slow"));
    if (slow > 0) mw.speed = 1 / slow;
    var dpr = window.devicePixelRatio || 1;
    function paint() {
      mw.paintFrames(document.getElementById("frames1"), Math.max(1, Math.floor(1.5 * dpr)));
      mw.paintFrames(document.getElementById("frames4"), Math.max(1, Math.floor(1.5 * dpr)) * 4);
    }
    paint();
    new MutationObserver(paint).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
  })();
</script>
