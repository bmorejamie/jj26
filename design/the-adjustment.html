<title>The Adjustment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { background:#0E0E10; overflow:hidden; font-family:'IBM Plex Mono',ui-monospace,monospace; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud, #tracks {
    position:fixed; display:flex; gap:10px; color:#8A8884; font-size:10.5px;
    letter-spacing:.08em; text-transform:uppercase;
    background:rgba(14,14,16,.72); padding:12px 14px; border:1px solid #26262A;
    backdrop-filter:blur(6px); user-select:none;
  }
  #hud { right:18px; bottom:16px; flex-direction:column; }
  #tracks { left:50%; transform:translateX(-50%); bottom:16px; }
  #hud label { display:flex; align-items:center; justify-content:space-between; gap:14px; }
  #hud input[type=range] { width:110px; accent-color:#EDECE8; }
  button {
    font:inherit; color:#8A8884; background:none; border:1px solid #26262A; padding:5px 10px;
    cursor:pointer; letter-spacing:.08em; text-transform:uppercase;
  }
  button:hover { color:#EDECE8; border-color:#8A8884; }
  button.on { color:#0E0E10; background:#EDECE8; border-color:#EDECE8; }
  #title { position:fixed; left:18px; bottom:16px; color:#8A8884; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; }
  @media (prefers-reduced-motion: reduce) { .anim-only { display:none !important; } }
</style>

<canvas id="c"></canvas>
<div id="title">the adjustment · v2 — 3d loop study</div>
<div id="tracks">
  <button data-t="A" class="on">A · Handles</button>
  <button data-t="B">B · The Path</button>
  <button data-t="C">C · Orbit</button>
</div>
<div id="hud">
  <label>DOF <input type="range" id="dof" min="0" max="220" value="110"></label>
  <label class="anim-only">Speed <input type="range" id="spd" min="40" max="160" value="100"></label>
  <label>Grain <input type="checkbox" id="grain" checked></label>
  <button id="pause" class="anim-only">Pause</button>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const DPR = Math.min(devicePixelRatio || 1, 1.5);
  let W, H, FPX;
  function resize() {
    W = innerWidth; H = innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    FPX = Math.min(W, H) * 1.05; // focal length in px
  }
  resize(); addEventListener('resize', resize);

  // ---------- the curve, animated ----------
  const T = 20;
  const BASE1 = { x:22, y:0 }, BASE2 = { x:36, y:0 };
  function ctrlAt(u) {
    const a = 2 * Math.PI * u;
    return {
      p1: { x: BASE1.x + 7.5*Math.sin(2*a+.6) + 2.5*Math.sin(5*a),
            y: BASE1.y + 10 *Math.sin(3*a+1.7) + 3*Math.sin(7*a+.4),
            z: 10*Math.sin(2*a+2.2) + 3.5*Math.sin(5*a+1.0) },
      p2: { x: BASE2.x + 9  *Math.sin(3*a+3.1) + 2.5*Math.sin(4*a+2),
            y: BASE2.y + 8  *Math.sin(2*a+4.4) + 3*Math.sin(6*a+1.1),
            z: -12*Math.sin(3*a+.9) - 4*Math.sin(4*a+2.6) },
    };
  }
  // svg-space (0..100, y down) -> world (centered, y up, z=0 plane)
  const w3 = (x, y, z=0) => ({ x:x-50, y:50-y, z });
  function bezPt(t, c) {
    const i = 1-t;
    const bx = i*i*i*0 + 3*i*i*t*c.p1.x + 3*i*t*t*c.p2.x + t*t*t*100;
    const by = i*i*i*100 + 3*i*i*t*c.p1.y + 3*i*t*t*c.p2.y + t*t*t*0;
    const bz = 3*i*i*t*c.p1.z + 3*i*t*t*c.p2.z; // endpoints pinned to the plane
    return w3(bx, by, bz);
  }

  function easeOurs(t) {
    const x1=.22, x2=.36;
    let lo=0, hi=1, s=t;
    for (let k=0;k<20;k++){ s=(lo+hi)/2;
      const i=1-s; (3*i*i*s*x1+3*i*s*s*x2+s*s*s) < t ? lo=s : hi=s; }
    const i=1-s; return 3*i*i*s+3*i*s*s+s*s*s;
  }

  // ---------- camera tracks ----------
  // key: {t, an:anchor, pk:pathParam, azim(deg), elev(deg), dist, fan:focusAnchor, fpk}
  const TRACKS = {
    A: [
      { t:0.00, an:'p1',  azim:-18, elev:8,  dist:15,  fan:'p1' },
      { t:0.16, an:'p1',  azim:-6,  elev:6,  dist:26,  fan:'p1' },
      { t:0.42, an:'mid', azim:0,   elev:4,  dist:150, fan:'mid' },
      { t:0.58, an:'mid', azim:14,  elev:18, dist:165, fan:'wall' },
      { t:0.74, an:'p2',  azim:24,  elev:10, dist:38,  fan:'p2' },
      { t:0.90, an:'p1',  azim:-10, elev:8,  dist:20,  fan:'p1' },
      { t:1.00, an:'p1',  azim:-18, elev:8,  dist:15,  fan:'p1' },
    ],
    B: [
      { t:0.00, an:'path', pk:0.02, azim:-64, elev:5,  dist:22,  fan:'path', fpk:0.18 },
      { t:0.30, an:'path', pk:0.45, azim:-76, elev:4,  dist:18,  fan:'path', fpk:0.60 },
      { t:0.55, an:'path', pk:0.93, azim:-58, elev:9,  dist:28,  fan:'path', fpk:0.97 },
      { t:0.76, an:'mid',  azim:-28, elev:42, dist:140, fan:'mid' },
      { t:1.00, an:'path', pk:0.02, azim:-64, elev:5,  dist:22,  fan:'path', fpk:0.18 },
    ],
    C: [
      { t:0.00, an:'mid', azim:0,   elev:32, dist:120, fan:'p1' },
      { t:0.25, an:'mid', azim:90,  elev:24, dist:104, fan:'path', fpk:0.5 },
      { t:0.50, an:'mid', azim:180, elev:30, dist:118, fan:'p2' },
      { t:0.75, an:'mid', azim:270, elev:22, dist:100, fan:'path', fpk:0.2 },
      { t:1.00, an:'mid', azim:360, elev:32, dist:120, fan:'p1' },
    ],
  };
  let track = 'A';

  function anchorPos(name, pk, c) {
    if (name === 'p1') return w3(c.p1.x, c.p1.y, c.p1.z);
    if (name === 'p2') return w3(c.p2.x, c.p2.y, c.p2.z);
    if (name === 'path') return bezPt(pk ?? .5, c);
    if (name === 'wall') return { x:0, y:0, z:-12 };
    return { x:0, y:2, z:0 };
  }
  const lerp = (a,b,e) => a + (b-a)*e;
  function camAt(u, c) {
    const K = TRACKS[track];
    let i = 0;
    while (i < K.length-1 && u > K[i+1].t) i++;
    const k0 = K[i], k1 = K[Math.min(i+1,K.length-1)];
    const e = easeOurs(Math.min((u-k0.t)/Math.max(k1.t-k0.t,1e-6),1));
    const a0 = anchorPos(k0.an, k0.pk, c), a1 = anchorPos(k1.an, k1.pk, c);
    const f0 = anchorPos(k0.fan, k0.fpk, c), f1 = anchorPos(k1.fan, k1.fpk, c);
    const target = { x:lerp(a0.x,a1.x,e), y:lerp(a0.y,a1.y,e), z:lerp(a0.z,a1.z,e) };
    const focusPt = { x:lerp(f0.x,f1.x,e), y:lerp(f0.y,f1.y,e), z:lerp(f0.z,f1.z,e) };
    const azim = lerp(k0.azim,k1.azim,e) * Math.PI/180;
    const elev = lerp(k0.elev,k1.elev,e) * Math.PI/180;
    const dist = lerp(k0.dist,k1.dist,e);
    const pos = {
      x: target.x + dist*Math.cos(elev)*Math.sin(azim),
      y: target.y + dist*Math.sin(elev),
      z: target.z + dist*Math.cos(elev)*Math.cos(azim),
    };
    // basis
    let f = norm(sub(target,pos));
    let r = norm(cross(f, {x:0,y:1,z:0}));
    if (!isFinite(r.x)) r = {x:1,y:0,z:0};
    const up = cross(r, f);
    const focusZ = dot(sub(focusPt,pos), f);
    return { pos, f, r, up, focusZ };
  }
  const sub=(a,b)=>({x:a.x-b.x,y:a.y-b.y,z:a.z-b.z});
  const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
  const cross=(a,b)=>({x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x});
  const norm=v=>{const l=Math.hypot(v.x,v.y,v.z)||1; return {x:v.x/l,y:v.y/l,z:v.z/l};};

  function proj(p, cam) {
    const d = sub(p, cam.pos);
    const z = dot(d, cam.f);
    if (z < 2) return null;
    return { x: dot(d,cam.r)/z*FPX + W/2, y: -dot(d,cam.up)/z*FPX + H/2, z };
  }

  // ---------- scene items ----------
  function collect(c, cam, dofAmt) {
    const items = []; // {x1,y1,x2,y2,w,color,dash,blur,z} or {circle}
    const add = (a, b, wWorld, color, dash) => {
      const A = proj(a,cam), B = proj(b,cam);
      if (!A || !B) return;
      const z = (A.z+B.z)/2;
      const coc = Math.min(Math.abs(z-cam.focusZ)/z * 34 * dofAmt, 15);
      items.push({ x1:A.x, y1:A.y, x2:B.x, y2:B.y, z,
        w: Math.max(wWorld/z*FPX, .5), color, dash, blur: Math.min(Math.round(coc), 15) });
    };
    // wall grid (z=-12), thin, quiet
    const GZ=-12, STEP=16, SUB=14;
    for (let gx=-110; gx<=210; gx+=STEP)
      for (let gy=-90; gy<=90; gy+=SUB)
        add({x:gx-50,y:gy,z:GZ},{x:gx-50,y:Math.min(gy+SUB,90),z:GZ},.14,'rgba(138,136,132,.14)');
    for (let gy=-80; gy<=80; gy+=STEP)
      for (let gx=-110; gx<=210; gx+=SUB)
        add({x:gx-50,y:gy,z:GZ},{x:Math.min(gx+SUB,210)-50,y:gy,z:GZ},.14,'rgba(138,136,132,.14)');
    // curve — thin, bone, sampled
    const N=64; let prev=bezPt(0,c);
    for (let i=1;i<=N;i++){ const pt=bezPt(i/N,c); add(prev,pt,.42,'#D8D6D0'); prev=pt; }
    // handle lines — grey dashes
    const e0=w3(0,100), e1=w3(100,0), h1=w3(c.p1.x,c.p1.y,c.p1.z), h2=w3(c.p2.x,c.p2.y,c.p2.z);
    const dsub=(a,b)=>{ for(let i=0;i<10;i++){
      const q1={x:lerp(a.x,b.x,i/10),y:lerp(a.y,b.y,i/10),z:lerp(a.z,b.z,i/10)},
            q2={x:lerp(a.x,b.x,(i+.55)/10),y:lerp(a.y,b.y,(i+.55)/10),z:lerp(a.z,b.z,(i+.55)/10)};
      add(q1,q2,.2,'rgba(138,136,132,.55)'); } };
    dsub(e0,h1); dsub(e1,h2);
    // points
    const pts = [
      { p:h1, r:1.6, stroke:'#8A8884', fill:'#0E0E10' },
      { p:h2, r:1.6, stroke:'#8A8884', fill:'#0E0E10' },
      { p:e0, r:1.3, stroke:null, fill:'#B9B7B2', diamond:true },
      { p:e1, r:1.3, stroke:null, fill:'#B9B7B2', diamond:true },
    ];
    for (const q of pts) {
      const P = proj(q.p, cam); if (!P) continue;
      const coc = Math.min(Math.abs(P.z-cam.focusZ)/P.z * 34 * dofAmt, 15);
      items.push({ pt:P, r:Math.max(q.r/P.z*FPX,1.5), q, z:P.z, blur:Math.min(Math.round(coc),15) });
    }
    return items;
  }

  // grain
  const noise = document.createElement('canvas');
  noise.width = 256; noise.height = 256;
  { const n = noise.getContext('2d'), d = n.createImageData(256,256);
    for (let i=0;i<d.data.length;i+=4){ const v=118+Math.random()*20|0; d.data[i]=d.data[i+1]=d.data[i+2]=v; d.data[i+3]=255; }
    n.putImageData(d,0,0); }

  // ---------- loop ----------
  const dofEl=document.getElementById('dof'), spdEl=document.getElementById('spd'),
        grainEl=document.getElementById('grain'), pauseEl=document.getElementById('pause');
  let paused=false;
  pauseEl.addEventListener('click',()=>{ paused=!paused; pauseEl.textContent=paused?'Play':'Pause'; });
  document.querySelectorAll('#tracks button').forEach(b=>{
    b.addEventListener('click',()=>{
      track=b.dataset.t;
      document.querySelectorAll('#tracks button').forEach(x=>x.classList.toggle('on',x===b));
    });
  });
  document.addEventListener('keydown',e=>{
    const m={'1':'A','2':'B','3':'C'}[e.key];
    if(m){ track=m; document.querySelectorAll('#tracks button').forEach(x=>x.classList.toggle('on',x.dataset.t===m)); }
  });

  const Q = new URLSearchParams(location.search);
  const STILL = Q.has('still');
  if (Q.get('track') && TRACKS[Q.get('track')]) {
    track = Q.get('track');
    document.querySelectorAll('#tracks button').forEach(x=>x.classList.toggle('on',x.dataset.t===track));
  }
  let u = STILL ? parseFloat(Q.get('u') || '.42') : (RM ? 0.42 : 0);
  let last = performance.now();
  function frame(now) {
    const dt=(now-last)/1000; last=now;
    if (!RM && !paused && !STILL) u=(u+dt*(spdEl.value/100)/T)%1;
    const c=ctrlAt(u), cam=camAt(u,c), dofAmt=dofEl.value/100;

    ctx.setTransform(DPR,0,0,DPR,0,0);
    ctx.filter='none'; ctx.globalCompositeOperation='source-over';
    ctx.fillStyle='#0E0E10'; ctx.fillRect(0,0,W,H);

    const items=collect(c,cam,dofAmt);
    // bucket by blur level; paint buckets far-to-near, one filter switch per bucket
    const buckets=new Map();
    for (const it of items) {
      let b=buckets.get(it.blur);
      if (!b){ b={ zsum:0, items:[] }; buckets.set(it.blur,b); }
      b.zsum+=it.z; b.items.push(it);
    }
    const order=[...buckets.entries()].sort((a,b)=>(b[1].zsum/b[1].items.length)-(a[1].zsum/a[1].items.length));
    for (const [blur, bucket] of order) {
      ctx.filter = blur>0 ? `blur(${blur}px)` : 'none';
      bucket.items.sort((a,b)=>b.z-a.z);
      for (const it of bucket.items) {
        if (it.pt) {
          const {q}=it;
          if (q.diamond){
            ctx.fillStyle=q.fill; ctx.save(); ctx.translate(it.pt.x,it.pt.y); ctx.rotate(Math.PI/4);
            ctx.fillRect(-it.r,-it.r,it.r*2,it.r*2); ctx.restore();
          } else {
            ctx.lineWidth=Math.max(it.r*.38,1); ctx.strokeStyle=q.stroke; ctx.fillStyle=q.fill;
            ctx.beginPath(); ctx.arc(it.pt.x,it.pt.y,it.r,0,7); ctx.fill(); ctx.stroke();
          }
        } else {
          ctx.strokeStyle=it.color; ctx.lineWidth=it.w; ctx.lineCap='round';
          ctx.beginPath(); ctx.moveTo(it.x1,it.y1); ctx.lineTo(it.x2,it.y2); ctx.stroke();
        }
      }
    }
    ctx.filter='none';

    // vignette
    const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);
    vg.addColorStop(0,'rgba(14,14,16,0)'); vg.addColorStop(1,'rgba(10,10,12,.55)');
    ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

    if (grainEl.checked){
      ctx.globalCompositeOperation='overlay'; ctx.globalAlpha=.07;
      const ox=Math.random()*128|0, oy=Math.random()*128|0;
      for(let x=-ox;x<W;x+=256) for(let y=-oy;y<H;y+=256) ctx.drawImage(noise,x,y);
      ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over';
    }
    if (!STILL) requestAnimationFrame(frame);
    else document.title = 'still ' + u.toFixed(2);
  }
  requestAnimationFrame(frame);
})();
</script>
